name: Build cGENIE (muffin)

on:
  push:
  workflow_dispatch:
    inputs:
      run_years:
        description: "积分年数（0 = 只编译不运行）"
        required: false
        default: "0"

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 300

    steps:
      - uses: actions/checkout@v4

      - name: 安装工具链
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gfortran libnetcdff-dev libnetcdf-dev make git
          gfortran --version | head -1
          nf-config --version

      - name: 缓存 cGENIE 源码
        id: cache-src
        uses: actions/cache@v4
        with:
          path: cgenie.muffin
          key: cgenie-src-v2

      - name: 获取源码
        if: steps.cache-src.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/derpycode/cgenie.muffin.git
          du -sh cgenie.muffin

      - name: 修补 Python2 脚本
        run: |
          sed -i 's/^\(\s*\)print \(.*\)$/\1print(\2)/' cgenie.muffin/genie-main/finc.py

      - name: 【终极修复】精准清理 Makefile 中的 libnc1 依赖
        run: |
          cd cgenie.muffin/genie-main
          
          # 1. 找到真正的 makefile 文件
          MF=""
          [ -f "makefile" ] && MF="makefile"
          [ -f "Makefile" ] && MF="Makefile"
          
          if [ -z "$MF" ]; then
            echo "❌ 找不到 makefile"
            exit 1
          fi
          
          echo "正在清理 $MF 中的 libnc1 规则..."
          
          # 2. 删除专门针对 libnc1 的独立目标（例如 libnc1.a:）
          sed -i '/libnc1.*:/d' "$MF"
          
          # 3. 删除包含 cd 和 libnc1 的执行语句（例如 cd ../genie-lib/libnc1; make）
          sed -i '/^[[:space:]]*cd.*libnc1/d' "$MF"
          sed -i '/^[[:space:]]*.*make.*libnc1/d' "$MF"
          
          # 4. 清理变量列表里的路径残留（例如 ../genie-lib/libnc1/libnc1.a），将其替换为空
          sed -i 's|[^ \t]*libnc1[^ \t]*||g' "$MF"
          
          # 5. 验证
          if grep -q 'libnc1' "$MF"; then
            echo "⚠️ 警告: 仍有残留，尝试全局清除"
            grep -n 'libnc1' "$MF"
            # 最后的兜底，直接删掉包含 libnc1 的行
            sed -i '/libnc1/d' "$MF"
          else
            echo "✅ 完美清理 $MF 中的 libnc1 痕迹！"
          fi

      - name: 编译 muffin（genie-main原生make）
        run: |
          cd cgenie.muffin/genie-main
          make clean > /dev/null 2>&1 || true
          # 为了安全，指定目标 genie.exe
          make NETCDF_DIR=/usr NETCDF_NAME=netcdff genie.exe 2>&1 | tail -60
          ls -lh genie.exe
          echo "BUILD_OK=1" >> $GITHUB_ENV

      - name: 检查 320 Ma 古地理数据
        run: |
          ls cgenie.muffin/genie-paleo | grep -E "^(300|320|340|360)" || true
          ls -lh cgenie.muffin/genie-paleo/320ebP2_/ | head -12 || true

      - name: 生成 320 Ma 配置
        run: |
          bash ./cgenie-visean-actions/scripts/make_config.sh

      - name: 试运行（可选）
        if: ${{ github.event.inputs.run_years != '0' && github.event.inputs.run_years != '' }}
        continue-on-error: true
        run: |
          cd cgenie.muffin/genie-main
          YEARS=${{ github.event.inputs.run_years }}
          mkdir -p "$HOME/cgenie_output"
          ./runmuffin.sh p0320c BASES RUN330 $YEARS 2>&1 | tail -40 || true
          ls -lh "$HOME/cgenie_output" || true

      - name: 打包产物
        if: always()
        run: |
          mkdir -p out
          cp cgenie.muffin/genie-main/genie.exe out/ 2>/dev/null || true
          cp -r cgenie.muffin/genie-main/configs out/ 2>/dev/null || true
          cp -r "$HOME/cgenie_output" out/ 2>/dev/null || true
          tar -czf cgenie-build-$(date +%Y%m%d).tar.gz out 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cgenie-build
          path: |
            cgenie-build-*.tar.gz
            out/genie.exe
          if-no-files-found: warn
